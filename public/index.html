<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GioPic Server Status Page" />
    <meta name="robots" content="noindex" />
    <title data-i18n="title">GioPic Server | Status</title>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"
    />
    <!-- Using Google Fonts for modern typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: light dark;
        --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        --card-bg: rgba(255, 255, 255, 0.6);
        --card-border: rgba(255, 255, 255, 0.7);
        --text-main: #111827;
        --text-sub: #4b5563;
        --brand-color: #e0234e;
        --brand-glow: rgba(224, 35, 78, 0.2);
        --success-bg: rgba(16, 185, 129, 0.15);
        --success-text: #059669;
        --shadow:
          0 20px 40px -10px rgba(0, 0, 0, 0.1),
          0 10px 20px -5px rgba(0, 0, 0, 0.04);
        --glass-blur: blur(20px);
        --btn-bg: rgba(255, 255, 255, 0.8);
        --btn-hover: #e0234e;
        --btn-text: #111827;
      }

      /* 自动跟随系统深浅模式 (Automatic dark mode via system preference) */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
          --card-bg: rgba(30, 41, 59, 0.5);
          --card-border: rgba(255, 255, 255, 0.08);
          --text-main: #f8fafc;
          --text-sub: #cbd5e1;
          --brand-glow: rgba(224, 35, 78, 0.4);
          --success-bg: rgba(16, 185, 129, 0.2);
          --success-text: #34d399;
          --shadow:
            0 20px 40px -10px rgba(0, 0, 0, 0.5),
            0 10px 20px -5px rgba(0, 0, 0, 0.3);
          --btn-bg: rgba(30, 41, 59, 0.8);
          --btn-text: #f8fafc;
        }
      }

      body {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg-gradient);
        color: var(--text-main);
        transition:
          background 0.5s ease,
          color 0.5s ease;
        overflow: hidden;
        position: relative;
      }

      /* Animated background blobbing for a premium feel */
      .bg-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: -1;
        animation: float 20s infinite alternate ease-in-out;
        opacity: 0.6;
      }

      .shape-1 {
        width: 50vw;
        height: 50vw;
        max-width: 600px;
        max-height: 600px;
        background: rgba(224, 35, 78, 0.15);
        top: -10%;
        left: -10%;
      }

      .shape-2 {
        width: 60vw;
        height: 60vw;
        max-width: 700px;
        max-height: 700px;
        background: rgba(59, 130, 246, 0.12);
        bottom: -20%;
        right: -10%;
        animation-delay: -5s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(5%, 5%) scale(1.05);
        }
        100% {
          transform: translate(-5%, 10%) scale(0.95);
        }
      }

      .container {
        text-align: center;
        padding: 3rem 2.5rem;
        background: var(--card-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        max-width: 440px;
        width: 90%;
        position: relative;
        transform: translateY(0);
        transition:
          transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10;
      }

      .container:hover {
        transform: translateY(-4px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      }

      /* Top vibrant glow line */
      .container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--brand-color),
          transparent
        );
        border-radius: 24px 24px 0 0;
        opacity: 0.9;
      }

      h1 {
        color: var(--text-main);
        margin: 0 0 1rem 0;
        font-size: 2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        letter-spacing: -0.02em;
      }

      h1 span.brand {
        color: var(--brand-color);
        text-shadow: 0 0 25px var(--brand-glow);
      }

      p {
        font-size: 1.05rem;
        color: var(--text-sub);
        margin-bottom: 2.5rem;
        line-height: 1.6;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0.6rem 1.25rem;
        background: var(--success-bg);
        color: var(--success-text);
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        border: 1px solid rgba(16, 185, 129, 0.2);
        transition:
          transform 0.2s ease,
          background 0.2s ease;
        cursor: default;
      }

      .status-badge:hover {
        transform: scale(1.03);
        background: rgba(16, 185, 129, 0.2);
      }

      .dot {
        width: 10px;
        height: 10px;
        background-color: currentColor;
        border-radius: 50%;
        position: relative;
      }

      .dot::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        background-color: currentColor;
        border-radius: 50%;
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        opacity: 0.8;
      }

      @keyframes ping {
        75%,
        100% {
          transform: translate(-50%, -50%) scale(2.5);
          opacity: 0;
        }
      }

      .meta-info {
        margin-top: 2.5rem;
        font-size: 0.85rem;
        color: var(--text-sub);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--card-border);
        padding-top: 1.5rem;
      }

      .meta-label {
        font-weight: 500;
      }

      #server-time {
        font-family: 'Inter', monospace;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        opacity: 0.9;
        background: rgba(0, 0, 0, 0.05);
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
      }

      @media (prefers-color-scheme: dark) {
        #server-time {
          background: rgba(255, 255, 255, 0.1);
        }
      }

      /* Language Switcher */
      .lang-switch {
        position: absolute;
        top: 2rem;
        right: 2rem;
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--btn-text);
        border-radius: 12px;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.3s ease;
        font-family: inherit;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .lang-switch:hover {
        background: var(--btn-hover);
        color: #ffffff;
        border-color: var(--btn-hover);
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(224, 35, 78, 0.3);
      }

      .lang-switch svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      /* Mobile adjustments */
      @media (max-width: 640px) {
        .lang-switch {
          top: 1rem;
          right: 1rem;
          padding: 0.4rem 0.8rem;
        }
        .container {
          padding: 2.5rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <button
      class="lang-switch"
      id="lang-btn"
      aria-label="Toggle Language"
      onclick="toggleLanguage()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"
        />
      </svg>
      <span id="lang-text">中 / EN</span>
    </button>

    <main class="container">
      <h1>
        <span class="brand">GioPic</span> <span data-i18n="server">Server</span>
      </h1>
      <p data-i18n="desc">
        The backend service is initialized and listening for requests.
      </p>

      <div class="status-badge">
        <div class="dot"></div>
        <span data-i18n="status">System Operational</span>
      </div>

      <div class="meta-info">
        <div class="meta-label" data-i18n="timeLabel">Server Time</div>
        <div id="server-time">Loading...</div>
      </div>
    </main>

    <script>
      // i18n Dictionary
      const i18n = {
        en: {
          title: 'GioPic Server | Status',
          server: 'Server',
          desc: 'The backend service is initialized and listening for requests.',
          status: 'System Operational',
          timeLabel: 'Server Time',
        },
        zh: {
          title: 'GioPic 服务器 | 状态',
          server: '服务器',
          desc: '后端服务已初始化并正在监听请求。',
          status: '系统运行正常',
          timeLabel: '服务器时间',
        },
      };

      let currentLang = 'en';

      // Initialize language based on browser preference (Automatic dual language support)
      function initLanguage() {
        // Check if language was manually saved previously
        const savedLang = localStorage.getItem('giopic_lang');
        if (savedLang && (savedLang === 'en' || savedLang === 'zh')) {
          currentLang = savedLang;
        } else {
          // Auto-detect system language
          const browserLang = navigator.language || navigator.userLanguage;
          if (browserLang.toLowerCase().includes('zh')) {
            currentLang = 'zh';
          } else {
            currentLang = 'en';
          }
        }
        applyLanguage(currentLang);
      }

      // Apply language to DOM
      function applyLanguage(lang) {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.title = i18n[lang].title;

        // Update semantic text
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (i18n[lang][key]) {
            el.textContent = i18n[lang][key];
          }
        });

        // Update button text to reflect the action to switch to the *other* language
        const langTextEl = document.getElementById('lang-text');
        if (langTextEl) {
          langTextEl.textContent = lang === 'en' ? '中文' : 'EN';
        }
      }

      // Toggle language manually
      function toggleLanguage() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('giopic_lang', currentLang);
        applyLanguage(currentLang);
      }

      // Clock update function
      function updateTime() {
        const now = new Date();
        // Format to YYYY-MM-DD HH:MM:SS UTC
        const timeString =
          now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
        document.getElementById('server-time').textContent = timeString;
      }

      // Bootstrapping
      document.addEventListener('DOMContentLoaded', () => {
        initLanguage();
        updateTime();
        setInterval(updateTime, 1000);
        console.log('GioPic Server Dashboard Loaded.');
      });
    </script>
  </body>
</html>
